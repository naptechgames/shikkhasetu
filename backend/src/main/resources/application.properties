# ShikkhaSetu backend - default profile (embedded H2 database stored in ./data)
# A cloud host can choose the port with the PORT environment variable.
server.port=${PORT:8080}
# Listen on all network interfaces so a phone on the same Wi-Fi can connect.
server.address=0.0.0.0

# WRITE_DELAY=0: every commit is written to disk at once, so nothing is lost
# if the server is killed or the laptop loses power right after an action.
spring.datasource.url=jdbc:h2:file:./data/shikkhasetu;LOCK_TIMEOUT=10000;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# Optional e-mail channel (Adapter pattern). The provider is a console stub.
app.email.enabled=false

# Seed accounts (first coordinator, optional demo data) are NOT configured here.
# Local: copy config/application.properties.example to config/application.properties.
# Cloud: set APP_SEED_COORDINATOR_EMAIL / APP_SEED_COORDINATOR_PASSWORD on the host.
