# Activate with:  --spring.profiles.active=mysql
# Create the database first:  CREATE DATABASE shikkhasetu CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/shikkhasetu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
